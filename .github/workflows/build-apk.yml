name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📦 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 🟢 Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 📦 Install deps
      - name: Install dependencies
        run: npm install

      # 🏗 Build web
      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: https://college-erp-server-kvc4.onrender.com
          VITE_SOCKET_URL: https://college-erp-server-kvc4.onrender.com
          VITE_RAZORPAY_KEY_ID: rzp_live_SN231JB1uxCoR7

      # ⚡ Capacitor install
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # ✅ ADD ANDROID (FIX)
      - name: Add Android Platform
        run: npx cap add android

      # 🔄 Sync
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔥 Auto version increment
      - name: Auto Increment versionCode
        run: |
          FILE=$(ls android/app/build.gradle*)

          CURRENT=$(grep versionCode $FILE | awk '{print $2}')
          NEXT=$((CURRENT + 1))

          echo "Old versionCode: $CURRENT"
          echo "New versionCode: $NEXT"

          sed -i "s/versionCode $CURRENT/versionCode $NEXT/" $FILE
          sed -i "s/versionName \".*\"/versionName \"1.$NEXT\"/" $FILE

      # 🔐 Permissions
      - name: Add Android Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="true" \/>' android/app/src/main/AndroidManifest.xml

      # ⚙️ Gradle fix
      - name: Update Gradle wrapper
        run: |
          cd android
          sed -i 's|gradle-8.2.1-all.zip|gradle-8.7-all.zip|g' gradle/wrapper/gradle-wrapper.properties

      # 📦 Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 📤 Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: college-erp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk